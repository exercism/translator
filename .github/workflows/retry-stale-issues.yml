# Re-dispatches translation issues that the automated queue has left open.
#
# translate-issue.yml runs once per dispatch, and a dispatch can be lost to a
# GitHub or DeepSeek outage, a cancelled run, or a failure that deliberately
# left the issue open. exercism/i18n only dispatches when an issue is opened or
# updated, so without this sweep nothing would pick it up again. It runs every
# six hours and dispatches the same event again for each waiting issue.
#
# An issue is only picked up if its updatedAt is more than two hours old. A run
# that does not close its issue posts a comment, which moves updatedAt, so an
# issue that has just failed is not retried straight away.
#
# An issue labelled `needs-attention` (config.json `github.attention_label`) is
# skipped. run-issue.mjs adds that label when a person has to act first: items
# the checker rejects every time, checker errors, the word cap, deletions. A
# retry would fail the same way and, for rejected items, pay DeepSeek again.
# The orchestrator session fixes those (/fix-i18n-issue), dispatches the issue
# itself, and the run that finishes it removes the label.
#
# Dispatching again is safe: run-issue.mjs only translates what a locale does
# not already have, so a finished issue finds nothing to do and is closed.
#
# ## Tokens
#
#   EXERCISM_I18N_PUSH_PAT           lists the open issues in exercism/i18n
#   EXERCISM_TRANSLATOR_DISPATCH_PAT Contents read/write on this repo, to
#                                    dispatch. The default GITHUB_TOKEN would not
#                                    work, because events it raises do not start
#                                    further workflow runs.

name: Retry stale issues

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: List and re-dispatch
        env:
          REPO: ${{ github.repository }}
          I18N_TOKEN: ${{ secrets.EXERCISM_I18N_PUSH_PAT }}
          DISPATCH_TOKEN: ${{ secrets.EXERCISM_TRANSLATOR_DISPATCH_PAT }}
          SKIP_LABEL: needs-attention
          # scripts/test.mjs runs this filter against sample issues.
          SELECT: '.[] | select(.updatedAt < $cutoff) | select(all(.labels[]; .name != $skip)) | .number'
        run: |
          set -euo pipefail

          if [ -z "${I18N_TOKEN:-}" ] || [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "The queue's tokens are not configured; nothing was swept. See this workflow's header."
            exit 0
          fi

          CUTOFF=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Only number, updatedAt and labels are fetched. An issue's title and
          # body are written by whoever opened the source PR, and are never read
          # here.
          NUMBERS=$(GH_TOKEN="$I18N_TOKEN" gh issue list --repo exercism/i18n \
            --state open --label translation --author iHiD --limit 100 \
            --json number,updatedAt,labels \
            | jq -r --arg cutoff "$CUTOFF" --arg skip "$SKIP_LABEL" "$SELECT")

          if [ -z "$NUMBERS" ]; then
            echo "No translation issue in exercism/i18n has been waiting since $CUTOFF."
            exit 0
          fi

          for number in $NUMBERS; do
            [[ "$number" =~ ^[1-9][0-9]{0,8}$ ]] || continue
            jq -n --argjson issue "$number" '{event_type: "translate-issue", client_payload: {issue: $issue}}' \
              | GH_TOKEN="$DISPATCH_TOKEN" gh api -X POST "repos/$REPO/dispatches" --input -
            echo "Re-dispatched #${number}."
          done
