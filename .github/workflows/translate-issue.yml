# Translates one queue issue, unattended.
#
# exercism/i18n dispatches this (from its translate-on-issue.yml) when a
# translation issue is opened or updated. The job is one call to
# scripts/run-issue.mjs, which verifies the issue, works out what the source PR
# changed, translates it for every production locale, checks it with the i18n
# repo's checker, commits, pushes to that repo's main, and closes the issue.
# Closing the issue re-runs the source PR's completeness check.
#
# ## What is trusted
#
# The payload carries one issue number. It is checked as digits here and again
# in the script, and nothing else in the payload is read. The script then
# fetches the issue through scripts/lib/issues.mjs, which checks the author, the
# label, that the source repo is allowlisted, and that the sha belongs to the
# PR. The repo, PR number and sha are the only values taken from the issue's
# title and body.
#
# ## Why repository_dispatch
#
# This repo is public so that Actions minutes are free. A public repo that holds
# a DeepSeek key and a push credential must not run code from outside it, so no
# trigger here can be reached by a fork's PR (which rules out
# pull_request_target). repository_dispatch needs a token that already has write
# access, and the only code this runs is this repo at main and the i18n repo at
# main.
#
# ## One run at a time
#
# Every run ends with a push to exercism/i18n main, which publishes the
# translations. The concurrency group runs them one at a time and never cancels
# a run in progress, because a cancelled run wastes paid translations and can
# leave a commit made but not pushed.
#
# GitHub keeps only one pending run per group, so in a burst of dispatches the
# newest waits and the others are dropped. The dropped issues are still open,
# and this run's last step hands the group on to one of them as it lets go of
# it: see "Drain the queue" below and scripts/lib/queue.mjs.
# retry-stale-issues.yml is the backstop for the case where that step is never
# reached.
#
# ## Secrets and tokens
#
#   DEEPSEEK_API_KEY               the translation engine, a repository secret.
#                                  Read from the environment, never written to
#                                  a file or printed.
#   EXERCISM_I18N_APP_PRIVATE_KEY  with the organisation variable
#                                  EXERCISM_I18N_APP_ID, mints a token for the
#                                  Exercism i18n GitHub App, limited to
#                                  exercism/i18n with Contents and Issues read
#                                  and write, for the push, the comments, the
#                                  `needs-attention` and `over-cap` labels and
#                                  the close. So all of those are by
#                                  `exercism-i18n[bot]`, and so are the commits
#                                  (config.json `github.commit_author`).
#
# An installation token lasts an hour. It is minted just before the translate
# step, and runs so far have taken a few minutes. A run that took longer would
# fail at the push and leave the issue open for the retry sweep.

name: Translate issue

on:
  repository_dispatch:
    types: [translate-issue]

concurrency:
  group: i18n-main
  cancel-in-progress: false

permissions: {}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Read the issue number out of the payload
        id: payload
        env:
          ISSUE: ${{ github.event.client_payload.issue }}
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::client_payload.issue is not an issue number."
            exit 1
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Check out the translator
        uses: actions/checkout@v7
        with:
          path: translator
          persist-credentials: false

      # Checked out as a sibling ../i18n, which is what config.json's
      # `i18n_repo` expects. Full history is needed because
      # scripts/no-deletions.mjs diffs the commit against origin/main and the
      # push rebases onto it.
      - name: Check out exercism/i18n
        uses: actions/checkout@v7
        with:
          repository: exercism/i18n
          ref: main
          path: i18n
          fetch-depth: 0
          persist-credentials: false

      # The version comes from the i18n repo's package.json `packageManager`.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: i18n/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Installs `yaml`, the i18n repo's only dependency, which its website
      # English builder uses. This repo has no dependencies.
      - name: Install the i18n repo's dependency
        working-directory: i18n
        run: pnpm install --frozen-lockfile

      - name: Mint a token for exercism/i18n
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EXERCISM_I18N_APP_ID }}
          private-key: ${{ secrets.EXERCISM_I18N_APP_PRIVATE_KEY }}
          owner: exercism
          repositories: i18n
          permission-contents: write
          permission-issues: write

      - name: Translate
        working-directory: translator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXERCISM_I18N_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/run-issue.mjs ${{ steps.payload.outputs.issue }}

      # Uploads the run's summaries, per-locale checker logs, the comment it
      # posted, issue-<n>.outcome.json and the rejected answers under
      # <run>/rejected/. A failure comment on the issue links to this, and
      # /fix-i18n-issue downloads it.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-issue-${{ steps.payload.outputs.issue }}-${{ github.run_id }}
          path: translator/state/runs/
          if-no-files-found: ignore
          retention-days: 30

      # ## Drain the queue
      #
      # This run holds the `i18n-main` group, so the issues whose dispatches
      # GitHub dropped are waiting on it and on nothing else. Dispatching one
      # here means it starts as this run ends, instead of waiting up to an hour
      # for the sweep. scripts/lib/queue.mjs chooses which, and dispatches one,
      # because dispatching several would drop all but the last of them again.
      #
      # Only a run that got as far as commenting "Starting translation now." on
      # its own issue drains. run-issue.mjs writes the marker file at that
      # point, so reaching it proves this workflow works. Without that guard, a
      # workflow that died before starting anything would dispatch the next
      # issue, whose run would die the same way and dispatch another, around the
      # queue for ever.
      #
      # A failure to drain is not a failure of the translation this run already
      # pushed, so the step is `continue-on-error` and the sweep picks the queue
      # up instead.
      - name: Did this run start its issue
        id: started
        if: always()
        working-directory: translator
        env:
          ISSUE: ${{ steps.payload.outputs.issue }}
        run: |
          set -euo pipefail
          if [ -f "state/runs/issue-${ISSUE}.started" ]; then
            echo "drain=true" >> "$GITHUB_OUTPUT"
          else
            echo "drain=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This run never started issue ${ISSUE}, so the queue is left to the sweep."
          fi

      - name: Mint a token to dispatch to this repo
        id: dispatch-token
        if: always() && steps.started.outputs.drain == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EXERCISM_I18N_APP_ID }}
          private-key: ${{ secrets.EXERCISM_I18N_APP_PRIVATE_KEY }}
          owner: exercism
          repositories: translator
          permission-contents: write

      - name: Drain the queue
        if: always() && steps.started.outputs.drain == 'true'
        continue-on-error: true
        working-directory: translator
        env:
          # Minted for the translate step, and reused here to list the issues
          # and to say on one that its dispatch was dropped.
          I18N_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: node scripts/queue-next.mjs --exclude=${{ steps.payload.outputs.issue }} --grace-minutes=0
